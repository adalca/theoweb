<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Olympic hockey scores</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="olympic-hockey-page">
  <main class="page olympic-tournament">
    <a class="back-link" href="index.html">← All Olympic hockey</a>
    <p class="eyebrow">Country vs. country</p>
    <h1 id="title">Olympic hockey scores</h1>
    <p class="intro" id="summary">Loading scores…</p>

    <div class="game-filter olympic-filter" id="country-filter-panel" hidden>
      <label for="country-filter">Find a country</label>
      <input id="country-filter" type="search" placeholder="Try Canada or Sweden" autocomplete="off">
      <span id="filter-count" aria-live="polite"></span>
    </div>

    <div id="olympic-matches"></div>
  </main>

  <script src="data.js"></script>
  <script src="tournament.js"></script>
</body>
</html>
